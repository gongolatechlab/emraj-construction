<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emraj Admin — Enterprise Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B1310;--surface:#12211B;--surface2:#1A2E26;--surface3:#244135;--text:#F0FDF4;--muted:#94A3B8;--line:rgba(255,255,255,0.08);--gold:#D4AF37;--gold-hover:#B5952F;--emerald:#10B981;--danger:#EF4444;--warn:#F59E0B;--blue:#3B82F6;--radius:12px;--shadow:0 4px 16px rgba(0,0,0,0.3);--shadow-lg:0 20px 40px rgba(0,0,0,0.5);--sidebar-w:260px;--topbar-h:64px}
[data-theme=light]{--bg:#F5F7F5;--surface:#fff;--surface2:#F0F4F0;--surface3:#E0E8E0;--text:#0B1310;--muted:#64748B;--line:rgba(0,0,0,0.08);--shadow:0 4px 16px rgba(0,0,0,0.06);--shadow-lg:0 20px 40px rgba(0,0,0,0.12)}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;font-size:14px}
h1,h2,h3,h4{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;line-height:1.2}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}
#pinLock{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#pinLock.hidden{display:none}
.pin-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 32px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.pin-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--gold-hover));color:#0B1310;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;font-family:'Space Grotesk',sans-serif}
.pin-card h1{font-size:22px;margin-bottom:6px}
.pin-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
.pin-input{width:100%;padding:16px;text-align:center;font-family:'SF Mono',monospace;font-size:28px;letter-spacing:.5em;background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.pin-input:focus{border-color:var(--gold);outline:none}
.pin-btn{width:100%;padding:14px;background:var(--gold);color:#0B1310;font-weight:600;border-radius:12px;font-size:15px;transition:background .2s}
.pin-btn:hover{background:var(--gold-hover)}
.pin-btn:disabled{opacity:.5;cursor:not-allowed}
.pin-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:20px}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s,width .2s}
.sidebar.collapsed{width:72px}
.sidebar.collapsed .side-text,.sidebar.collapsed .side-brand-name,.sidebar.collapsed .side-section{display:none}
.sidebar-head{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.sidebar.collapsed .sidebar-head{justify-content:center;padding:0}
.side-brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-hover));color:#0B1310;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
.side-brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;line-height:1.1}
.side-brand-name span{color:var(--gold)}
.side-brand-name small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.05em;margin-top:2px}
.side-nav{flex:1;padding:16px 8px;overflow-y:auto}
.side-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:all .15s;cursor:pointer;border:none;width:100%;text-align:left}
.side-item:hover{background:var(--surface2);color:var(--text)}
.side-item.active{background:var(--surface2);color:var(--gold)}
.side-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar.collapsed .side-item{justify-content:center;padding:10px}
.side-section{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:16px 14px 8px;font-weight:600}
.side-footer{padding:12px;border-top:1px solid var(--line);flex-shrink:0}
.main{flex:1;margin-left:var(--sidebar-w);transition:margin-left .2s;display:flex;flex-direction:column;min-width:0}
.main.sidebar-collapsed{margin-left:72px}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:50}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);transition:all .15s;position:relative}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;flex-shrink:0}
.topbar-spacer{flex:1}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:36px;max-width:280px;flex:1}
.search-box input{background:none;border:none;outline:none;width:100%;font-size:13px}
.search-box svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.search-box:focus-within{border-color:var(--gold)}
.notif-badge{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:1.5px solid var(--surface)}
.admin-chip{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:10px;transition:background .15s;cursor:pointer}
.admin-chip:hover{background:var(--surface2)}
.admin-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-hover));color:#0B1310;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:'Space Grotesk',sans-serif}
.admin-name{font-size:12px;font-weight:600;line-height:1.2}
.admin-role{font-size:10px;color:var(--muted)}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:200px;padding:6px;z-index:200;display:none}
.dropdown.open{display:block}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text);transition:background .15s;cursor:pointer;width:100%;text-align:left}
.dropdown-item:hover{background:var(--surface2)}
.dropdown-item svg{width:16px;height:16px;color:var(--muted)}
.dropdown-item.danger{color:var(--danger)}
.dropdown-divider{height:1px;background:var(--line);margin:6px 0}
.user-menu-wrap{position:relative}
.content{flex:1;padding:20px;max-width:1600px;width:100%;margin:0 auto;padding-bottom:90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:border-color .2s}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600}
.card-subtitle{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-charts{grid-template-columns:repeat(2,1fr)}
@media(max-width:1024px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}.grid-charts{grid-template-columns:1fr}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;transition:all .2s;cursor:pointer}
.kpi:hover{border-color:rgba(212,175,55,.3);transform:translateY(-1px)}
.kpi-head{display:flex;align-items:center;justify-content:space-between}
.kpi-icon{width:36px;height:36px;border-radius:10px;background:rgba(212,175,55,.12);color:var(--gold);display:flex;align-items:center;justify-content:center}
.kpi-icon.green{background:rgba(16,185,129,.12);color:var(--emerald)}
.kpi-icon.blue{background:rgba(59,130,246,.12);color:var(--blue)}
.kpi-icon.warn{background:rgba(245,158,11,.12);color:var(--warn)}
.kpi-icon.danger{background:rgba(239,68,68,.12);color:var(--danger)}
.kpi-icon svg{width:18px;height:18px}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1.1}
.kpi-trend{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500}
.kpi-trend.up{color:var(--emerald)}
.kpi-trend.down{color:var(--danger)}
.kpi-trend.neutral{color:var(--muted)}
.spark{height:36px;width:100%;margin-top:2px;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.pill.green{background:rgba(16,185,129,.12);color:var(--emerald);border:1px solid rgba(16,185,129,.25)}
.pill.amber{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.pill.red{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25)}
.pill.blue{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.pill.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.gold{background:rgba(212,175,55,.12);color:var(--gold);border:1px solid rgba(212,175,55,.25)}
.progress{height:6px;background:var(--surface2);border-radius:100px;overflow:hidden}
.progress-bar{height:100%;background:var(--gold);border-radius:100px;transition:width .4s}
.progress-bar.green{background:var(--emerald)}
.progress-bar.red{background:var(--danger)}
.progress-bar.amber{background:var(--warn)}
.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar-search{flex:1;min-width:180px;max-width:320px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px}
.toolbar-search svg{width:16px;height:16px;color:var(--muted)}
.toolbar-search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.toolbar-search:focus-within{border-color:var(--gold)}
.select-wrap{position:relative}
.select-wrap select{appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 32px 0 12px;height:38px;font-size:13px;cursor:pointer}
.select-wrap::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top-color:var(--muted);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;height:38px;border-radius:10px;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--gold);color:#0B1310}
.btn-primary:hover{background:var(--gold-hover)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#DC2626}
.btn-sm{height:32px;padding:0 10px;font-size:12px}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2);border-bottom:1px solid var(--line)}
th{text-align:left;padding:12px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--gold)}
th .sort-arrow{display:inline-block;margin-left:4px;font-size:10px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:var(--surface2)}
@media(max-width:768px){table,thead,tbody,th,td,tr{display:block}thead{display:none}tbody tr{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface2)}td{display:flex;justify-content:space-between;padding:6px 0;border:none;gap:12px;text-align:right}td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:left}}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px;flex-wrap:wrap}
.pagination-info{font-size:12px;color:var(--muted)}
.pagination-controls{display:flex;gap:4px}
.page-btn{min-width:32px;height:32px;padding:0 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600;transition:all .15s}
.page-btn:hover:not(:disabled){background:var(--surface3);border-color:var(--gold)}
.page-btn.active{background:var(--gold);color:#0B1310;border-color:var(--gold)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted)}
.empty-state svg{width:48px;height:48px;margin:0 auto 12px;opacity:.5}
.empty-state h3{font-size:15px;color:var(--text);margin-bottom:4px;font-family:'Space Grotesk',sans-serif}
.empty-state p{font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:8000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-family:'Space Grotesk',sans-serif;font-weight:700}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-size:13px;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold)}
.form-error{color:var(--danger);font-size:11px;margin-top:4px;min-height:14px}
.slideover{position:fixed;inset:0;z-index:8000;display:none}
.slideover.open{display:block}
.slideover-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fadeIn .15s}
.slideover-panel{position:absolute;top:0;right:0;bottom:0;width:100%;max-width:480px;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);overflow-y:auto;animation:slideIn .2s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.slideover-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.slideover-body{padding:20px}
#toasts{position:fixed;top:16px;right:16px;z-index:9500;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:slideRight .2s;font-size:13px}
@keyframes slideRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left:3px solid var(--emerald)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--blue)}
.toast svg{width:18px;height:18px}
.toast.success svg{color:var(--emerald)}
.toast.error svg{color:var(--danger)}
.toast.info svg{color:var(--blue)}
.bottom-tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
.bottom-tabs-grid{display:grid;grid-template-columns:repeat(5,1fr)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:8px;color:var(--muted);font-size:10px;font-weight:500;transition:color .15s}
.tab-item.active{color:var(--gold)}
.tab-item svg{width:20px;height:20px}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.chart-wrap{position:relative;height:240px;width:100%}
.chart-wrap.tall{height:280px}
.alert-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.alert-item:last-child{border-bottom:none}
.alert-icon{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.alert-icon.warn{background:rgba(245,158,11,.12);color:var(--warn)}
.alert-icon.danger{background:rgba(239,68,68,.12);color:var(--danger)}
.alert-icon.info{background:rgba(59,130,246,.12);color:var(--blue)}
.alert-icon svg{width:16px;height:16px}
.alert-text{flex:1;font-size:13px}
.alert-text small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.timeline-item p{font-size:13px;line-height:1.4}
.timeline-item time{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.gantt{overflow-x:auto;padding-bottom:8px}
.gantt-grid{display:grid;grid-template-columns:160px 1fr;gap:0;min-width:700px}
.gantt-months{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:1px solid var(--line)}
.gantt-month{font-size:10px;color:var(--muted);text-align:center;padding:6px 0;border-left:1px solid var(--line)}
.gantt-month:first-child{border-left:none}
.gantt-row-name{font-size:12px;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;border-bottom:1px solid var(--line);height:38px;display:flex;align-items:center}
.gantt-bar{position:absolute;height:16px;border-radius:4px;background:var(--gold);opacity:.85}
.gantt-bar.green{background:var(--emerald)}
.gantt-bar.amber{background:var(--warn)}
.gantt-bar.red{background:var(--danger)}
.report-section{margin-bottom:24px}
.report-section h3{font-size:14px;font-family:'Space Grotesk',sans-serif;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.report-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.report-row:last-child{border-bottom:none;font-weight:700;padding-top:12px}
@media print{.sidebar,.topbar,.bottom-tabs,.no-print,#toasts{display:none!important}.main{margin-left:0!important}.content{padding:0!important;max-width:100%!important}body{background:#fff!important;color:#000!important}.card{border:1px solid #ccc!important;box-shadow:none!important;break-inside:avoid}}

function fmtN(n){if(n==null)return'—';return'₦'+Math.round(n).toLocaleString('en-NG');}

function toast(msg,type='info'){

el.innerHTML=(icons[type]||icons.info)+'<span>'+escapeHtml(msg)+'</span>';
document.getElementById('toasts').appendChild(el);
setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),200);},3000);
}

function kpiCard(label,value,trendDir,trendText,color,iconPath,sparkData){
const trendCls=trendDir==='up'?'up':trendDir==='down'?'down':'neutral';
const arrow=trendDir==='up'?'↑':trendDir==='down'?'↓':'→';
return `<div class="kpi"><div class="kpi-head"><div class="kpi-icon ${color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconPath}</svg></div></div><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div><div class="kpi-trend ${trendCls}">${arrow} ${trendText}</div><canvas class="spark" data-spark='${JSON.stringify(sparkData)}'></canvas></div>`;
}

function getTableState(key){if(!state.tables[key])state.tables[key]={search:'',sort:null,sortDir:'asc',page:1,filter:'all'};return state.tables[key];}

function renderTable(config){
const{key,columns,rows,perPage=8,statusKey,onRowClick,actions}=config;
const t=getTableState(key);
let filtered=rows.slice();
if(t.search){const q=t.search.toLowerCase();filtered=filtered.filter(r=>columns.some(c=>String(r[c.key]||'').toLowerCase().includes(q)));}
if(t.filter!=='all'&&statusKey){filtered=filtered.filter(r=>r[statusKey]===t.filter);}
if(t.sort){filtered.sort((a,b)=>{const av=a[t.sort],bv=b[t.sort];const cmp=typeof av==='number'?av-bv:String(av).localeCompare(String(bv));return t.sortDir==='asc'?cmp:-cmp;});}
const total=filtered.length;
const pages=Math.max(1,Math.ceil(total/perPage));
if(t.page>pages)t.page=pages;
const start=(t.page-1)*perPage;
const pageRows=filtered.slice(start,start+perPage);
const filters=statusKey?[...new Set(rows.map(r=>r[statusKey]))]:[];
let html=`<div class="table-toolbar">
<div class="toolbar-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" placeholder="Search…" value="${escapeHtml(t.search)}" oninput="updateTable('${key}','search',this.value)" aria-label="Search table"></div>
${filters.length?`<div class="select-wrap"><select onchange="updateTable('${key}','filter',this.value)" aria-label="Filter"><option value="all"${t.filter==='all'?' selected':''}>All statuses</option>${filters.map(f=>`<option value="${escapeHtml(f)}"${t.filter===f?' selected':''}>${escapeHtml(f)}</option>`).join('')}</select></div>`:''}
${actions||''}
<button class="btn btn-ghost btn-sm" onclick="exportCSV('${key}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>CSV</button>
<button class="btn btn-ghost btn-sm" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>Print</button>
</div>
<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th onclick="sortTable('${key}','${c.key}')" ${t.sort===c.key?'class="sorted"':''}>${escapeHtml(c.label)}${t.sort===c.key?`<span class="sort-arrow">${t.sortDir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>
${pageRows.length===0?`<tr><td colspan="${columns.length}"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><h3>No results</h3><p>Try adjusting your search or filter.</p></div></td></tr>`:pageRows.map(r=>`<tr onclick="rowAction('${key}','${escapeHtml(String(r.id))}')">${columns.map(c=>`<td data-label="${escapeHtml(c.label)}">${c.render?c.render(r[c.key],r):escapeHtml(r[c.key])}</td>`).join('')}</tr>`).join('')}
</tbody></table></div>
<div class="pagination"><div class="pagination-info">Showing ${total===0?0:start+1}–${Math.min(start+perPage,total)} of ${total}</div><div class="pagination-controls"><button class="page-btn" onclick="gotoPage('${key}',${t.page-1})" ${t.page<=1?'disabled':''} aria-label="Previous">‹</button>${Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,t.page-2),Math.max(0,t.page-2)+5).map(p=>`<button class="page-btn ${p===t.page?'active':''}" onclick="gotoPage('${key}',${p})">${p}</button>`).join('')}<button class="page-btn" onclick="gotoPage('${key}',${t.page+1})" ${t.page>=pages?'disabled':''} aria-label="Next">›</button></div></div>`;
return html;
}
function registerTable(key,config){TABLE_CONFIGS[key]=config;}
function updateTable(key,field,val){const t=getTableState(key);t[field]=val;if(field!=='page')t.page=1;rerenderPage();}
function sortTable(key,col){const t=getTableState(key);if(t.sort===col)t.sortDir=t.sortDir==='asc'?'desc':'asc';else{t.sort=col;t.sortDir='asc';}rerenderPage();}
function gotoPage(key,p){const t=getTableState(key);t.page=Math.max(1,p);rerenderPage();}
function rowAction(key,id){const cfg=TABLE_CONFIGS[key];if(cfg&&cfg.onRowClick)cfg.onRowClick(id);}
function exportCSV(key){const cfg=TABLE_CONFIGS[key];if(!cfg)return;const cols=cfg.columns.filter(c=>c.key);const header=cols.map(c=>c.label).join(',');const rows=cfg.rows.map(r=>cols.map(c=>`"${String(r[c.key]??'').replace(/"/g,'""')}"`).join(','));const csv=[header,...rows].join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='emraj-'+key+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Exported '+key+'.csv','success');}
function rerenderPage(){const p=state.page;if(p==='projects')renderProjects();else if(p==='fleet')renderFleet();else if(p==='staff')renderStaff();else if(p==='clients')renderClients();else if(p==='finance')renderFinance();}

function renderProjects(){
const d=state.data;
const columns=[
{key:'id',label:'ID',render:v=>`<span class="text-muted" style="font-family:monospace;font-size:11px">${escapeHtml(v)}</span>`},
{key:'name',label:'Project',render:v=>`<span class="fw-600">${escapeHtml(v)}</span>`},
{key:'location',label:'Location'},
{key:'manager',label:'Manager'},
{key:'budget',label:'Budget',render:v=>fmtN(v)},
{key:'completion',label:'Progress',render:(v,r)=>`<div style="display:flex;align-items:center;gap:8px;min-width:100px"><div class="progress" style="flex:1"><div class="progress-bar ${r.risk==='high'?'red':r.risk==='medium'?'amber':''}" style="width:${v}%"></div></div><span class="text-sm fw-600">${v}%</span></div>`},
{key:'status',label:'Status',render:v=>`<span class="${statusClass(v)}">${escapeHtml(v)}</span>`}];
const config={key:'projects',columns,rows:d.projects,statusKey:'status',onRowClick:id=>openProjectDetail(id),actions:`<button class="btn btn-primary btn-sm" onclick="openProjectForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>New Project</button>`};
registerTable('projects',config);
document.getElementById('content').innerHTML=`<div class="card mb-4"><div class="card-head"><div><div class="card-title">Gantt Timeline</div><div class="card-subtitle">Project schedule overview</div></div></div>${renderGantt()}</div><div class="card"><div class="card-head"><div><div class="card-title">All Projects</div><div class="card-subtitle">${d.projects.length} total</div></div></div>${renderTable(config)}</div>`;
}
function renderGantt(){const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const rows=state.data.projects.map(p=>{const startM=new Date(p.start).getMonth();const endM=new Date(p.deadline).getMonth();const leftPct=(startM/12)*100;const widthPct=((endM-startM+1)/12)*100;const color=p.status==='Completed'?'green':p.risk==='high'?'red':p.risk==='medium'?'amber':'';return`<div class="gantt-row-name">${escapeHtml(p.name.slice(0,20))}</div><div class="gantt-track"><div class="gantt-bar ${color}" style="left:${leftPct}%;width:${widthPct}%" title="${p.completion}% complete"></div></div>`;}).join('');return`<div class="gantt"><div class="gantt-grid"><div style="border-bottom:1px solid var(--line)"></div><div class="gantt-months">${months.map(m=>`<div class="gantt-month">${m}</div>`).join('')}</div>${rows}</div></div>`;}
function openProjectDetail(id){const p=state.data.projects.find(x=>x.id===id);if(!p)return;openSlideover(p.name,renderProjectDetail(p));}
function renderProjectDetail(p){const usedPct=Math.round(p.spend/p.budget*100);return`<div class="mb-4"><span class="${statusClass(p.status)}">${p.status}</span> <span class="${statusClass(p.risk)}" style="margin-left:6px">${p.risk} risk</span></div><div class="grid grid-2" style="gap:12px;margin-bottom:20px"><div><div class="text-sm text-muted">Project ID</div><div class="fw-600" style="font-family:monospace">${p.id}</div></div><div><div class="text-sm text-muted">Location</div><div class="fw-600">${escapeHtml(p.location)}</div></div><div><div class="text-sm text-muted">Manager</div><div class="fw-600">${escapeHtml(p.manager)}</div></div><div><div class="text-sm text-muted">Client</div><div class="fw-600">${escapeHtml(p.client)}</div></div><div><div class="text-sm text-muted">Start</div><div class="fw-600">${fmtDate(p.start)}</div></div><div><div class="text-sm text-muted">Deadline</div><div class="fw-600">${fmtDate(p.deadline)}</div></div></div><div class="report-section"><h3>Budget</h3><div class="report-row"><span>Total</span><span>${fmtN(p.budget)}</span></div><div class="report-row"><span>Spent</span><span>${fmtN(p.spend)}</span></div><div class="report-row"><span>Remaining</span><span>${fmtN(p.budget-p.spend)}</span></div><div class="report-row"><span>Budget Used</span><span>${usedPct}%</span></div></div><div class="report-section"><h3>Progress</h3><div class="flex items-center gap-3 mb-2"><div class="progress" style="flex:1"><div class="progress-bar" style="width:${p.completion}%"></div></div><span class="fw-600">${p.completion}%</span></div></div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn btn-primary" onclick="openProjectForm('${p.id}')">Edit Project</button><button class="btn btn-danger" onclick="deleteProject('${p.id}')">Delete</button></div>`;}

}
function openInvoiceDetail(id){const inv=state.data.invoices.find(x=>x.id===id);if(!inv)return;openSlideover('Invoice '+inv.id,`<span class="${statusClass(inv.status)}">${inv.status}</span><div class="grid grid-2 mt-4" style="gap:12px"><div><div class="text-sm text-muted">Client</div><div class="fw-600">${escapeHtml(inv.client)}</div></div><div><div class="text-sm text-muted">Project</div><div class="fw-600">${escapeHtml(inv.project)}</div></div><div><div class="text-sm text-muted">Amount</div><div class="fw-600">${fmtN(inv.amount)}</div></div><div><div class="text-sm text-muted">Issued</div><div class="fw-600">${fmtDate(inv.issued)}</div></div><div><div class="text-sm text-muted">Due</div><div class="fw-600">${fmtDate(inv.due)}</div></div></div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn btn-primary" onclick="openInvoiceForm('${inv.id}')">Edit</button><button class="btn btn-danger" onclick="deleteInvoice('${inv.id}')">Delete</button></div>`);}
function openInvoiceForm(id){const inv=id?state.data.invoices.find(x=>x.id===id):null;openModal(inv?'Edit Invoice':'New Invoice',`<div class="form-group"><label class="form-label">Client</label><select class="form-select" id="fi_client">${state.data.clients.map(c=>`<option ${inv?.client===c.name?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Project ID</label><select class="form-select" id="fi_project">${state.data.projects.map(p=>`<option ${inv?.project===p.id?'selected':''}>${p.id}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Amount (₦)</label><input class="form-input" type="number" id="fi_amount" value="${inv?.amount||0}"></div><div class="form-group"><label class="form-label">Issued</label><input class="form-input" type="date" id="fi_issued" value="${inv?.issued||new Date().toISOString().slice(0,10)}"></div><div class="form-group"><label class="form-label">Due</label><input class="form-input" type="date" id="fi_due" value="${inv?.due||new Date(Date.now()+2592000000).toISOString().slice(0,10)}"></div><div class="form-group"><label class="form-label">Status</label><select class="form-select" id="fi_status">${['Pending','Partial','Paid'].map(s=>`<option ${inv?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInvoice(${inv?`'${inv.id}'`:'null'})">${inv?'Save':'Create'}</button>`);}
function saveInvoice(id){const data={client:document.getElementById('fi_client').value,project:document.getElementById('fi_project').value,amount:+document.getElementById('fi_amount').value||0,issued:document.getElementById('fi_issued').value,due:document.getElementById('fi_due').value,status:document.getElementById('fi_status').value};if(id){Object.assign(state.data.invoices.find(x=>x.id===id),data);toast('Invoice updated','success');}else{state.data.invoices.unshift({id:'INV-'+new Date().getFullYear()+'-'+String(state.data.invoices.length+1).padStart(3,'0'),...data});toast('Invoice created','success');}saveState();closeModal();closeSlideover();renderFinance();}
function deleteInvoice(id){if(!confirm('Delete this invoice?'))return;state.data.invoices=state.data.invoices.filter(x=>x.id!==id);saveState();closeSlideover();renderFinance();toast('Invoice deleted','success');}

function renderReports(){
const d=state.data;
const totalContracts=d.projects.reduce((s,p)=>s+p.budget,0);
const totalSpend=d.projects.reduce((s,p)=>s+p.spend,0);
const fleetValue=d.fleet.reduce((s,f)=>s+f.value,0);
const activeProj=d.projects.filter(p=>p.status!=='Completed').length;
const totalPaid=d.clients.reduce((s,c)=>s+c.paid,0);
const totalOutstanding=d.clients.reduce((s,c)=>s+c.contract-c.paid,0);
document.getElementById('content').innerHTML=`<div class="card"><div class="card-head"><div><div class="card-title">Executive Summary Report</div><div class="card-subtitle">Generated ${fmtDate(new Date().toISOString())}</div></div><button class="btn btn-primary btn-sm" onclick="window.print()">Print Report</button></div><div class="report-section"><h3>Company Overview</h3><div class="report-row"><span>Total Projects</span><span>${d.projects.length}</span></div><div class="report-row"><span>Active Projects</span><span>${activeProj}</span></div><div class="report-row"><span>Total Contract Value</span><span>${fmtN(totalContracts)}</span></div><div class="report-row"><span>Total Spend</span><span>${fmtN(totalSpend)}</span></div><div class="report-row"><span>Fleet Value</span><span>${fmtN(fleetValue)}</span></div><div class="report-row"><span>Workforce</span><span>128</span></div></div><div class="report-section"><h3>Financials</h3><div class="report-row"><span>Total Billed</span><span>${fmtN(d.invoices.reduce((s,i)=>s+i.amount,0))}</span></div><div class="report-row"><span>Collected</span><span>${fmtN(totalPaid)}</span></div><div class="report-row"><span>Outstanding</span><span>${fmtN(totalOutstanding)}</span></div></div><div class="report-section"><h3>Projects</h3>${d.projects.map(p=>`<div class="report-row"><span>${escapeHtml(p.name)}</span><span>${fmtN(p.budget)}</span></div>`).join('')}</div><div class="report-section"><h3>Clients</h3>${d.clients.map(c=>`<div class="report-row"><span>${escapeHtml(c.name)}</span><span>${fmtN(c.contract)}</span></div>`).join('')}</div></div>`;
}

function initApp(){
applyTheme();
const pinInp=document.getElementById('pinInput');
if(pinInp){
pinInp.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
pinInp.focus();
}
document.getElementById('pinBtn').addEventListener('click',tryUnlock);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSlideover();closeUserMenu();}});
}

loadState();
applyTheme();
initApp();
if(sessionStorage.getItem('emraj_unlocked')==='1'){
document.getElementById('pinLock').classList.add('hidden');
document.getElementById('app').style.visibility='visible';
startIdleTimer();
navigate('overview');
}else{
document.getElementById('pinInput').focus();
}
</script>
</body>
</html>
